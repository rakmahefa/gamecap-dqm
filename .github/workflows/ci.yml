name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify the offline bundle
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/offline-assets.json
          test -f dist/manifest.webmanifest
          grep -q 'assets/index-' dist/index.html
          icons=$(find dist/img/monster -name '*.webp' | wc -l | tr -d ' ')
          echo "monster icons in bundle: $icons"
          test "$icons" -ge 900
          node -e "const a = require('./dist/offline-assets.json'); if (!Array.isArray(a.icons) || a.icons.length < 900) { console.error('offline manifest incomplete'); process.exit(1); } console.log('offline manifest entries:', a.icons.length);"
          test "$(find dist/img/monster -name '*.webp' -size 0 | wc -l | tr -d ' ')" = "0"
          echo "bundle size: $(du -sh dist | cut -f1)"

      - name: Upload offline build
        uses: actions/upload-artifact@v4
        with:
          name: dqm2-offline-compendium
          path: dist
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    name: Deploy the offline build to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download the offline build
        uses: actions/download-artifact@v4
        with:
          name: dqm2-offline-compendium
          path: site

      - name: Verify the downloaded bundle
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/sw.js
          test -f site/offline-assets.json
          echo "publishing $(du -sh site | cut -f1) with $(find site/img/monster -name '*.webp' | wc -l | tr -d ' ') icons"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
