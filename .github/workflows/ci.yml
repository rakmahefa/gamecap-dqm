name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify the offline bundle
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/offline-assets.json
          test -f dist/manifest.webmanifest
          grep -q 'assets/index-' dist/index.html
          icons=$(find dist/img/monster -name '*.webp' | wc -l | tr -d ' ')
          echo "monster icons in bundle: $icons"
          test "$icons" -ge 900
          node -e "const a = require('./dist/offline-assets.json'); if (!Array.isArray(a.icons) || a.icons.length < 900) { console.error('offline manifest incomplete'); process.exit(1); } console.log('offline manifest entries:', a.icons.length);"
          test "$(find dist/img/monster -name '*.webp' -size 0 | wc -l | tr -d ' ')" = "0"
          echo "bundle size: $(du -sh dist | cut -f1)"

      - name: Upload offline build
        uses: actions/upload-artifact@v7
        with:
          name: dqm2-offline-compendium
          path: dist
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    name: Deploy the offline build to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Report the GitHub Pages site
        env:
          PAGES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/pages"
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${PAGES_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" || echo '000')

          if [ "$status" = "200" ]; then
            {
              echo "A GitHub Pages site exists for ${GITHUB_REPOSITORY}:"
              jq -r '
                [
                  "  url:            " + (.html_url // "(none)"),
                  "  status:         " + (.status // "(unknown)"),
                  "  build_type:     " + (.build_type // "(unknown)"),
                  "  source branch:  " + (.source.branch // "(none)"),
                  "  source path:    " + (.source.path // "(none)"),
                  "  custom domain:  " + (.cname // "(none)"),
                  "  https enforced: " + ((.https_enforced // false) | tostring),
                  "  certificate:    " + (.https_certificate.state // "(none)")
                ] | .[]
              ' "$body"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Pages site found::${GITHUB_REPOSITORY} has a Pages site; deploying to it."
            build_type=$(jq -r '.build_type // ""' "$body")
            if [ "$build_type" != "workflow" ]; then
              echo "::warning title=Pages source is not GitHub Actions::build_type is '${build_type}', so actions/deploy-pages cannot publish this artifact. Set Settings → Pages → Build and deployment → Source to 'GitHub Actions'."
            fi
          elif [ "$status" = "404" ]; then
            echo "::error title=No GitHub Pages site::GET ${api} returned 404 — ${GITHUB_REPOSITORY} has no Pages site, so actions/configure-pages and actions/deploy-pages have nothing to deploy to. Enable it in Settings → Pages → Build and deployment → Source: 'GitHub Actions' (private repositories also need a plan that includes Pages)."
            echo "No GitHub Pages site exists for ${GITHUB_REPOSITORY} (API returned 404)." >> "$GITHUB_STEP_SUMMARY"
            cat "$body"
            exit 1
          else
            echo "::error title=Pages API error::GET ${api} returned HTTP ${status}; the Pages state could not be read."
            echo "The Pages API returned HTTP ${status} for ${GITHUB_REPOSITORY}." >> "$GITHUB_STEP_SUMMARY"
            cat "$body"
            exit 1
          fi

      - name: Download the offline build
        uses: actions/download-artifact@v8
        with:
          name: dqm2-offline-compendium
          path: site

      - name: Verify the downloaded bundle
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/sw.js
          test -f site/offline-assets.json
          echo "publishing $(du -sh site | cut -f1) with $(find site/img/monster -name '*.webp' | wc -l | tr -d ' ') icons"

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
